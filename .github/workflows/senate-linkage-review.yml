name: Senate linkage aggregate review

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/senate-linkage-review.yml

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/senate-vote-identities'
    runs-on: [self-hosted, linux, x64, espana-transparente]
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=30000"
    steps:
      - name: Count linkage causes without exporting names or identifiers
        run: |
          psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'verified_alias_targets', (
              SELECT count(DISTINCT p.id) FROM politicians p
              JOIN politician_memberships pm ON pm.politician_id=p.id
              JOIN legislatures l ON l.id=pm.legislature_id
              WHERE p.senate_id=20013 AND pm.chamber='senate' AND l.number=15
            ),
            'alias_pending_rows', (
              SELECT coalesce(sum(vote_rows),0) FROM senate_vote_unmatched_names
              WHERE normalized_name='eduardo pujol bonell'
            ),
            'legacy_unkeyed_rows', (
              SELECT coalesce(sum(greatest(vote_rows-cardinality(seen_vote_keys),0)),0)
              FROM senate_vote_unmatched_names
            )
          );
          ROLLBACK;
          SQL

  public_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: senate-votes-39479923366
          run-id: 39479923366
          github-token: ${{ github.token }}
          path: official-votes
      - name: Inspect published vote names and XML identity fields
        run: |
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import re
          import unicodedata
          import xml.etree.ElementTree as ET
          counts = Counter()
          forms = defaultdict(set)
          fields = set()
          accepted = Counter()
          rejected = Counter()
          for path in Path("official-votes").glob("*.xml"):
              root = ET.fromstring(path.read_text().lstrip("\ufeff \t\r\n"))
              for node in root.findall(".//VotoSenador") + root.findall(".//ausentes/ausencia"):
                  name = (node.findtext("nombre") or "").strip()
                  key = re.sub(r"[^a-z ]", "", unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode().lower())
                  key = " ".join(key.split())
                  counts[key] += 1
                  vote_key = unicodedata.normalize("NFKD", node.findtext("voto") or "").encode("ascii", "ignore").decode().lower().strip()
                  if node.tag == "ausencia" or vote_key in {"si", "no", "abstencion", "no vota"}:
                      accepted[key] += 1
                  else:
                      rejected[vote_key] += 1
                  forms[key].add(name)
                  fields.update(child.tag for child in node)
          print("REJECTED_PUBLIC_NAMES", sorted((sorted(forms[k]), counts[k], accepted[k]) for k in counts if counts[k] != accepted[k]))
          print("OFFICIAL_XML_FIELDS", sorted(fields))
          print("OFFICIAL_COVERAGE", sum(counts.values()), "rows;", len(counts), "distinct normalized names")
          print("ACCEPTED_COVERAGE", sum(accepted.values()), "rows; rejected labels:", dict(rejected))
          for key, count in sorted(accepted.items()):
              if count == 327 or not key or "vacan" in key:
                  print("PUBLIC_SOURCE_NAME_COUNT", count, sorted(forms[key]))
          PY
