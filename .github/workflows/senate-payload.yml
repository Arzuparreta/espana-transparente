name: Senate official XML payload

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - etl/src/senado/**
      - etl/tests/test_senado_payload.py
      - .github/workflows/senate-payload.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Check catalog links that do not return XML
        env:
          PYTHONPATH: etl/src
        run: |
          python3 - <<'PY'
          import subprocess
          from common.http_headers import curl_header_args
          for number in (1, 2, 60, 61, 9999):
              url = f"https://www.senado.es/legis15/votaciones/ses_{number}.xml"
              response = subprocess.run(
                  ["curl", "-sSL", "--compressed", "--max-time", "20",
                   *curl_header_args(), "-w", "\\nHTTP_STATUS=%{http_code}", url],
                  capture_output=True, text=True, timeout=25)
              print(url, response.stdout[-30:], response.stdout[:1000], flush=True)
          PY

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Fetch and parse every published session
        working-directory: etl
        env:
          PYTHONPATH: src
        run: python -m src.senado.votaciones --export-directory "${{ runner.temp }}/senate-votes"
      - uses: actions/upload-artifact@v4
        with:
          name: senate-votes-${{ github.run_id }}
          path: ${{ runner.temp }}/senate-votes
          if-no-files-found: error
          retention-days: 3
