server {
    server_name spaintransparencia.info www.spaintransparencia.info;

    # Public Supabase surface. Keep Studio, pg_meta, analytics, Mailpit, and
    # PostgreSQL private even though the local CLI binds them on the host.
    location ~ ^/supabase/(?:auth|rest|storage|realtime|graphql)/v1(?:/|$) {
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /supabase;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
    }

    location /supabase/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/spaintransparencia.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaintransparencia.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 84-247-161-82.sslip.io;

    ssl_certificate /etc/letsencrypt/live/84-247-161-82.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/84-247-161-82.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name spaintransparencia.info www.spaintransparencia.info;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 84-247-161-82.sslip.io;
    return 404;
}
